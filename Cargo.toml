[package]
name = "virtual-audio-mixer"
version = "0.3.0"
edition = "2024"
description = "Mix a microphone with per-app audio into a virtual microphone on Windows"
license = "GPL-3.0-or-later"
rust-version = "1.88"
repository = "https://github.com/actuallyatiger/virtual-audio"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
minisign-verify = "0.3.0"
nnnoiseless = { version = "0.5.2", default-features = false }
rtrb = "0.4.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sonora = "0.2.0"
symphonia = { version = "0.5.5", features = ["mp3", "aac", "isomp4"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
ureq = { version = "3.4.2", default-features = false, features = ["rustls", "platform-verifier"] }

[target."cfg(windows)".dependencies]
tray-icon = "0.26.1"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_Threading", "Win32_Devices_FunctionDiscovery", "Win32_UI_Shell_PropertiesSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_System_LibraryLoader", "Win32_Security", "Win32_Storage_FileSystem", "Foundation", "Foundation_Collections", "Devices_Enumeration", "Media_Audio"] }
windows-core = "0.62.2"

[profile.release]
lto = true
codegen-units = 1
strip = true

# Echo cancellation runs in real time, also in tests and debug builds.
[profile.dev.package."sonora-aec3"]
opt-level = 3

[profile.dev.package."sonora-fft"]
opt-level = 3

[profile.dev.package.sonora]
opt-level = 3
