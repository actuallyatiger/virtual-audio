name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # Each saved config schema is a released format, like a migration: a PR
  # may add the next one, never change or remove one (see AGENTS.md). The
  # tests can't tell an edited schema from a new one, so this compares with
  # the base branch.
  config-schemas:
    name: Config schemas unchanged
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Only new schemas
        run: |
          changed=$(git diff --name-status --diff-filter=DMRT "origin/$BASE...HEAD" -- 'docs/config/*.schema.json')
          if [ -n "$changed" ]; then
            echo "$changed"
            echo "::error::A saved config schema was changed or removed. Leave it as it is: raise config::VERSION, add a migration and save the new format as the next v<N>.schema.json."
            exit 1
          fi
        env:
          BASE: ${{ github.base_ref }}

  release-build:
    name: Windows release build
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # A test build: it shows the commit it was built from and never
      # updates itself (only the release workflow sets VAM_RELEASE).
      - name: Build
        shell: bash
        run: VAM_COMMIT="${HEAD_SHA::7}" cargo build --release
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: virtual-audio-mixer-windows-x64
          path: target/release/virtual-audio-mixer.exe
