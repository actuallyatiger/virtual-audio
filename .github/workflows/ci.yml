name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # The schema of each released config format is fixed, like a released
  # migration: a change may add the next one, never change or remove one
  # (see AGENTS.md). The tests can't tell an edited schema from a new one,
  # so this compares with the last release. Until a release has it, a
  # version's schema can still change.
  config-schemas:
    name: Config schemas unchanged
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Only new schemas since the last release
        run: |
          if ! release=$(git describe --tags --abbrev=0 --match 'v*'); then
            echo "No release yet."
            exit 0
          fi
          changed=$(git diff --name-status --diff-filter=DMRT "$release" HEAD -- 'docs/config/*.schema.json')
          if [ -n "$changed" ]; then
            echo "$changed"
            echo "::error::A config schema released in $release or earlier was changed or removed. Leave it as it is: raise config::VERSION, add a migration and save the new format as the next v<N>.schema.json."
            exit 1
          fi

  release-build:
    name: Windows release build
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # A test build: it shows the commit it was built from and never
      # updates itself (only the release workflow sets VAM_RELEASE).
      - name: Build
        shell: bash
        run: VAM_COMMIT="${HEAD_SHA::7}" cargo build --release
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: virtual-audio-mixer-windows-x64
          path: target/release/virtual-audio-mixer.exe
