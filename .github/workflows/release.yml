name: Release

# release-please keeps a release PR open that bumps the version in
# Cargo.toml and adds the new Conventional Commits to CHANGELOG.md. Merging
# it tags the release as a draft; the Windows build is attached and only
# then is the release published, so the latest release always has the exe.

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-please:
    name: Release / Version and changelog
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write # the autorelease labels
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Update the release PR, or tag the release
        uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # The tag's own code, tested before it's built and published.
  test:
    name: Release / Test
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Check out the tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run tests
        run: cargo test

  build:
    name: Release / Build Windows exe
    needs: [release-please, test]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Check out the tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      # Only releases are built with VAM_RELEASE: without it, the app is a
      # test build and never updates itself.
      - name: Build the exe
        run: cargo build --release
        env:
          VAM_RELEASE: "1"
      - name: Upload the exe
        uses: actions/upload-artifact@v4
        with:
          name: virtual-audio-mixer
          path: target/release/virtual-audio-mixer.exe
          if-no-files-found: error

  publish:
    name: Release / Sign and publish
    needs: [release-please, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the exe
        uses: actions/download-artifact@v4
        with:
          name: virtual-audio-mixer
      # The app only installs updates signed by the release key, and the
      # trusted comment names the version (src/update.rs). The signature is
      # appended to the exe, then its length in 8 digits and VAMSIG01, so a
      # release is one file. No key, no release: an unsigned exe would never
      # be installed as an update.
      - name: Install minisign
        run: sudo apt-get install -y -q minisign
      - name: Sign
        run: |
          if [ -z "$MINISIGN_SECRET_KEY" ]; then
            echo "::error::The MINISIGN_SECRET_KEY secret isn't set"
            exit 1
          fi
          umask 077
          key="$RUNNER_TEMP/release.key"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key"
          printf '%s\n' "$MINISIGN_PASSWORD" |
            minisign -S -s "$key" -m virtual-audio-mixer.exe -x "$RUNNER_TEMP/exe.minisig" \
              -t "virtual-audio-mixer ${TAG#v}"
          cat "$RUNNER_TEMP/exe.minisig" >> virtual-audio-mixer.exe
          printf '%08dVAMSIG01' "$(stat -c %s "$RUNNER_TEMP/exe.minisig")" >> virtual-audio-mixer.exe
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
      # Always named virtual-audio-mixer.exe, so
      # releases/latest/download/virtual-audio-mixer.exe keeps working.
      - name: Attach the exe and publish
        run: |
          gh release upload "$TAG" virtual-audio-mixer.exe --clobber
          gh release edit "$TAG" --draft=false --latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
