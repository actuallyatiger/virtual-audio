name: Release

# release-please keeps a release PR open that bumps the version in
# Cargo.toml and adds the new Conventional Commits to CHANGELOG.md. Merging
# it tags the release as a draft; the Windows build is attached and only
# then is the release published, so the latest release always has the exe.

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write # the autorelease labels
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    name: Windows build
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read # SignPath fetches the unsigned build
    outputs:
      code_signed: ${{ steps.pick.outputs.code_signed }}
    env:
      # Code signing (Authenticode, through SignPath) once it's set up: see
      # the release skill. Until then releases go out unsigned for Windows.
      CODE_SIGNING: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      # Only releases are built with VAM_RELEASE: without it, the app is a
      # test build and never updates itself.
      - run: cargo build --release
        env:
          VAM_RELEASE: "1"
      - uses: actions/upload-artifact@v4
        id: unsigned
        if: ${{ env.CODE_SIGNING == 'true' }}
        with:
          name: unsigned
          path: target/release/virtual-audio-mixer.exe
          if-no-files-found: error
      - uses: signpath/github-action-submit-signing-request@v1
        if: ${{ env.CODE_SIGNING == 'true' }}
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          output-artifact-directory: signed
      - name: Pick the exe
        id: pick
        shell: bash
        run: |
          mkdir out
          if [ "$CODE_SIGNING" = true ]; then
            cp signed/virtual-audio-mixer.exe out/
          else
            cp target/release/virtual-audio-mixer.exe out/
          fi
          echo "code_signed=$CODE_SIGNING" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: virtual-audio-mixer
          path: out/virtual-audio-mixer.exe
          if-no-files-found: error

  publish:
    name: Attach the build and publish
    needs: [release-please, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: virtual-audio-mixer
      # The app only installs updates signed by the release key, and the
      # trusted comment names the version (src/update.rs). The signature is
      # appended to the exe, then its length in 8 digits and VAMSIG01, so a
      # release is one file; but a code-signed exe would no longer pass
      # Windows' check with anything appended, so its signature goes beside
      # it as virtual-audio-mixer.exe.minisig. No key, no release: an
      # unsigned exe would never be installed as an update.
      - run: sudo apt-get install -y -q minisign
      - name: Sign
        run: |
          if [ -z "$MINISIGN_SECRET_KEY" ]; then
            echo "::error::The MINISIGN_SECRET_KEY secret isn't set"
            exit 1
          fi
          umask 077
          key="$RUNNER_TEMP/release.key"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key"
          printf '%s\n' "$MINISIGN_PASSWORD" |
            minisign -S -s "$key" -m virtual-audio-mixer.exe -x "$RUNNER_TEMP/exe.minisig" \
              -t "virtual-audio-mixer ${TAG#v}"
          if [ "$CODE_SIGNED" = true ]; then
            cp "$RUNNER_TEMP/exe.minisig" virtual-audio-mixer.exe.minisig
          else
            cat "$RUNNER_TEMP/exe.minisig" >> virtual-audio-mixer.exe
            printf '%08dVAMSIG01' "$(stat -c %s "$RUNNER_TEMP/exe.minisig")" >> virtual-audio-mixer.exe
          fi
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          CODE_SIGNED: ${{ needs.build.outputs.code_signed }}
      # Always named virtual-audio-mixer.exe, so
      # releases/latest/download/virtual-audio-mixer.exe keeps working.
      - run: |
          if [ -f virtual-audio-mixer.exe.minisig ]; then
            gh release upload "$TAG" virtual-audio-mixer.exe.minisig --clobber
          fi
          gh release upload "$TAG" virtual-audio-mixer.exe --clobber
          gh release edit "$TAG" --draft=false --latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
